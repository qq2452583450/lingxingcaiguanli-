name: Release stale formal exam attempts

on:
  push:
    branches: [prod]
    paths:
      - 'tools/release_stale_formal_attempts.py'
      - '.github/workflows/release-stale-formal-attempts.yml'

concurrency:
  group: lxclgl-prod-deploy
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Back up and release obsolete formal attempts
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $AppDir = 'C:\wwwroot\lxclgl'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; $Db = Join-Path $AppDir '零星材管理系统.db'; Set-Location -LiteralPath $AppDir; git fetch origin prod; git checkout prod; git pull --ff-only origin prod; & $Python tools\release_stale_formal_attempts.py --db $Db --expected-title '综合题库四'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; & $Python tools\release_stale_formal_attempts.py --db $Db --expected-title '综合题库四' --apply --backup; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
