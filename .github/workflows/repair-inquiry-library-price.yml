name: Repair inquiry library price

on:
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Sync the inquiry library price from materials
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $ErrorActionPreference = 'Stop'; $AppDir = 'C:\wwwroot\lxclgl'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; $Db = (Get-ChildItem -LiteralPath $AppDir -Filter '*.db' -File | Sort-Object Length -Descending | Select-Object -First 1).FullName; if (-not $Db) { throw 'Production database not found' }; $Code = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String('')); $Code | & $Python - $Db 'KMXXW1Q-20260824-001'; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
