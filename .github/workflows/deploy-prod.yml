name: Deploy prod

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: lxclgl-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer verified Git bundle
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || 22 }}
          BUNDLE_UPLOAD_SCRIPT: >-
            $ErrorActionPreference = 'Stop';
            $File = [System.IO.File]::Create('C:\wwwroot\lxclgl\deploy-production.bundle');
            try { [Console]::OpenStandardInput().CopyTo($File) } finally { $File.Dispose() }
        run: |
          set -euo pipefail
          git bundle create production.bundle HEAD
          git bundle verify production.bundle
          umask 077
          key="$RUNNER_TEMP/lxclgl-deploy-key"
          known_hosts="$RUNNER_TEMP/lxclgl-known-hosts"
          trap 'rm -f "$key" "$known_hosts" production.bundle' EXIT
          printf '%s\n' "$PROD_SSH_KEY" | tr -d '\r' > "$key"
          ssh-keyscan -T 15 -p "$PROD_SSH_PORT" "$PROD_SSH_HOST" > "$known_hosts"
          test -s "$known_hosts"
          encoded=$(python -c 'import base64, os; print(base64.b64encode(os.environ["BUNDLE_UPLOAD_SCRIPT"].encode("utf-16-le")).decode("ascii"))')
          uploaded=0
          for attempt in 1 2 3; do
            if ssh -i "$key" -p "$PROD_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known_hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 "$PROD_SSH_USER@$PROD_SSH_HOST" "powershell -NoProfile -NonInteractive -EncodedCommand $encoded" < production.bundle; then
              uploaded=1
              break
            fi
            sleep 5
          done
          test "$uploaded" -eq 1
      - name: Sync prod source
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "& { $ErrorActionPreference = 'Continue'; $AppDir = 'C:\wwwroot\lxclgl'; $Bundle = Join-Path $AppDir 'deploy-production.bundle'; $Diag = Join-Path $AppDir 'deploy-diagnostic.txt'; Set-Location -LiteralPath $AppDir; 'deploy_sha=${{ github.sha }}' | Set-Content -LiteralPath $Diag; git bundle verify $Bundle; if ($LASTEXITCODE -ne 0) { throw 'Invalid production bundle' }; git status --short *>&1 | Add-Content -LiteralPath $Diag; git stash push -m 'deploy-autostash-${{ github.sha }}' *>&1 | Add-Content -LiteralPath $Diag; if ($LASTEXITCODE -ne 0) { throw 'Unable to preserve local changes' }; function Invoke-Retry($Name, [scriptblock]$Command) { for ($i = 1; $i -le 5; $i++) { ('{0}_attempt={1}' -f $Name, $i) | Add-Content -LiteralPath $Diag; & $Command *>&1 | Add-Content -LiteralPath $Diag; $Exit = $LASTEXITCODE; ('{0}_exit={1}' -f $Name, $Exit) | Add-Content -LiteralPath $Diag; if ($Exit -eq 0) { return }; Start-Sleep -Seconds 15 }; throw ($Name + ' failed after retrying') }; Invoke-Retry 'bundle_fetch' { git fetch --no-tags $Bundle HEAD:refs/remotes/origin/prod }; Invoke-Retry 'checkout' { git checkout prod }; Invoke-Retry 'rebase' { git rebase origin/prod }; $Actual = (git rev-parse HEAD).Trim(); if ($LASTEXITCODE -ne 0 -or $Actual -ne '${{ github.sha }}') { throw 'Production revision mismatch' }; Remove-Item -LiteralPath $Bundle -ErrorAction Stop }"
      - name: Restart production service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "& { & C:\wwwroot\lxclgl\deploy\deploy.ps1 -AppDir C:\wwwroot\lxclgl -ServiceName lxclgl -Branch prod -Port 5000 -SkipGitSync -ExpectedCommit ${{ github.sha }}; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
      - name: Verify production routes
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 2m
          script: |
            powershell -NoProfile -Command "& { $LastError = $null; for ($i = 1; $i -le 6; $i++) { try { Write-Output ('verify_attempt=' + $i); $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000' -UseBasicParsing -TimeoutSec 10; if ([int]$r.StatusCode -ne 200) { throw 'HTTP health check failed' }; $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/api/petty-cash/usages/1' -Method Options -UseBasicParsing -TimeoutSec 10; $allow = [string]$r.Headers['Allow']; if ($allow -notmatch 'PUT') { throw ('Petty cash usage PUT route not loaded. Allow=' + $allow) }; $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/api/petty-cash/usages/1/reimburse' -Method Options -UseBasicParsing -TimeoutSec 10; $allow = [string]$r.Headers['Allow']; Write-Output ('petty_cash_reimburse_allow=' + $allow); if ($allow -notmatch 'POST') { throw ('Petty cash reimburse route not loaded. Allow=' + $allow) }; $r = Invoke-WebRequest -Uri 'http://127.0.0.1:5000/api/exam/admin/current-paper' -Method Options -UseBasicParsing -TimeoutSec 10; $allow = [string]$r.Headers['Allow']; Write-Output ('current_exam_allow=' + $allow); if ($allow -notmatch 'DELETE') { throw ('Current exam paper DELETE route not loaded. Allow=' + $allow) }; exit 0 } catch { $LastError = $_; Write-Output ('verify_error=' + $_.Exception.Message); Start-Sleep -Seconds 10 } }; throw $LastError }"
      - name: Read production diagnostics
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 2m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "$AppDir = 'C:\wwwroot\lxclgl'; $Nssm = Join-Path $AppDir 'tools\nssm.exe'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; . (Join-Path $AppDir 'deploy\server.env.ps1'); Write-Output ('runtime_sha=' + (git -C $AppDir rev-parse HEAD)); foreach ($setting in 'Application', 'AppDirectory', 'AppParameters') { Write-Output ('nssm_' + $setting + '='); & $Nssm get lxclgl $setting }; Push-Location $AppDir; & $Python -c 'import app; print([(r.endpoint, sorted(r.methods)) for r in app.app.url_map.iter_rules() if r.rule == ''/api/exam/admin/current-paper''])'; Pop-Location; $ErrLog = Join-Path $AppDir '.server-err.log'; if (Test-Path -LiteralPath $ErrLog) { Write-Output 'recent_server_errors:'; Get-Content -LiteralPath $ErrLog -Tail 120 } else { Write-Output 'recent_server_errors: none' }"
