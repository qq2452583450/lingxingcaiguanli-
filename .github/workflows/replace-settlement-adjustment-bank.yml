name: Replace settlement adjustment question bank

on:
  workflow_dispatch:

concurrency:
  group: lxclgl-settlement-adjustment-bank-replace
  cancel-in-progress: false

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Back up and replace the production question bank
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $AppDir = 'C:\wwwroot\lxclgl'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; $Db = (Get-ChildItem -LiteralPath $AppDir -Filter '*.db' -File | Select-Object -First 1).FullName; $Source = Join-Path $AppDir 'docs\exam_sources\question_bank\物资管理-结算单调差应用规范题库.docx'; if (-not $Db) { throw 'Production database not found' }; if (-not (Test-Path -LiteralPath $Source)) { throw 'Settlement adjustment question bank source not found' }; $Backup = $Db + '.before-settlement-adjustment-bank-' + (Get-Date -Format 'yyyyMMdd-HHmmss'); Copy-Item -LiteralPath $Db -Destination $Backup -ErrorAction Stop; Set-Location -LiteralPath $AppDir; & $Python -c \"from pathlib import Path; from services.exam_import_service import replace_exam_paper_from_question_bank_docx; print(replace_exam_paper_from_question_bank_docx(Path(r'$Source')))\"; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
