name: Set Liu Guanghua practice records 20260721 20260722

on:
  workflow_dispatch:

concurrency:
  group: lxclgl-set-liu-practice-20260721-22
  cancel-in-progress: false

jobs:
  set-records:
    runs-on: ubuntu-latest
    steps:
      - name: Set exact Liu Guanghua practice records
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $AppDir = 'C:\wwwroot\lxclgl'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; $Sha = '${{ github.sha }}'; $Url = 'https://raw.githubusercontent.com/qq2452583450/lingxingcaiguanli-/' + $Sha + '/.github/scripts/set_liu_practice_20260721_22.py'; $ScriptPath = Join-Path $env:TEMP 'set-liu-practice-20260721-22.py'; [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12; Invoke-WebRequest -Uri $Url -OutFile $ScriptPath -UseBasicParsing; & $Python $ScriptPath; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
