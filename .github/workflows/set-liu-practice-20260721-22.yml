name: Set Liu Guanghua practice records 20260721 20260722

on:
  workflow_dispatch:

concurrency:
  group: lxclgl-set-liu-practice-20260721-22
  cancel-in-progress: false

jobs:
  set-records:
    runs-on: ubuntu-latest
    steps:
      - name: Set exact Liu Guanghua practice records
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 10m
          script: |
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& { $AppDir = 'C:\wwwroot\lxclgl'; $Python = Join-Path $AppDir '.venv\Scripts\python.exe'; $Payload = ''; $ScriptPath = Join-Path $env:TEMP 'set-liu-practice-20260721-22.py'; [IO.File]::WriteAllText($ScriptPath, [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($Payload)), [Text.Encoding]::UTF8); & $Python $ScriptPath; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }"
